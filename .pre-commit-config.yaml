repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: python-syntax
        name: python-syntax
        entry: python3 -m py_compile
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: python3 -m pytest tests/ -q -x
        language: system
        pass_filenames: false
        always_run: true

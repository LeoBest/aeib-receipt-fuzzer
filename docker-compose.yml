# docker-compose.yml — SMAOS Zero-Egress Demo (v0.3.0)
# Runs all 4 fault scenarios locally under --network none.
# No external registry pull required — builds from source.
#
# Usage:
#   docker compose up --build          # run all 4 scenarios
#   docker compose up --build -d       # detached
#
# Output:
#   ./audit_out/<scenario_id>/disposition_report.json
#   ./audit_out/<scenario_id>/audit_trace.mermaid
#   ./audit_out/<scenario_id>/dora_art17_gap_report.json
#   ./audit_out/<scenario_id>/ProofOrStopFilter.java

version: "3.9"

services:
  smaos-demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: smaos-demo:0.3.0
    container_name: smaos-demo
    network_mode: "none"
    volumes:
      - ./audit_out:/app/audit_out:rw
      - ./fixtures:/app/fixtures:ro
    environment:
      PYTHONUNBUFFERED: "1"
    command: >
      sh -c "
        set -e &&
        for s in 504_timeout tcp_reset confirmed refused; do
          echo \"[+] Running scenario: $$s\" &&
          python3 run.py --scenario $$s --export-dir /app/audit_out/$$s;
        done &&
        echo '' &&
        echo '[✔] All scenarios complete. Artifacts in ./audit_out/'
      "
